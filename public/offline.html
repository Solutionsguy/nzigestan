<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nzigestan Offline</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #0a0a0a;
        color: #e5e2e1;
        font-family: 'Space Grotesk', system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
      }
      .container { max-width: 480px; }
      h1 {
        font-family: 'Anton', Impact, sans-serif;
        font-size: 3rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 1rem;
        color: #E50914;
      }
      p { color: #888; margin-bottom: 2rem; line-height: 1.6; }
      a {
        display: inline-block;
        padding: 0.75rem 2rem;
        background: #E50914;
        color: white;
        text-decoration: none;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.875rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        border: none;
        cursor: pointer;
      }
      a:hover { background: #FF0033; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Tuko kwa Barabara</h1>
      <p>You're currently offline. The Republic of Nzigestan is built for the streets — check your connection and try again.</p>
      <a href="/">Return to Nzigestan</a>
    </div>
  </body>
</html>
